gcc-env:
  compiler: [gcc]
  network:
      mpi: cray-mpich@9.1.0+cuda
      specs: ['libfabric@2.4.0+cuda']
  unify: true
  specs:
  - nlcglib@develop +tests +cuda +openmp
  - cuda@13
  - kokkos+serial@4.7.02
  variants:
  - +cuda
  - cuda_arch=90
  views:
    nlcglib:
      link: roots
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
