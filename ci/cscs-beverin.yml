include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - baseimage
  - build
  - test

.f7t-secrets:
  variables:
    F7T_URL: "https://api.cscs.ch/beverin/firecrest/v2"
    F7T_TOKEN_URL: "https://auth.cscs.ch/auth/realms/firecrest-clients/protocol/openid-connect/token"

build base uenv mi300:
  extends: [.uenv-builder-beverin-mi300, .f7t-secrets]
  stage: baseimage
  timeout: 24h
  variables:
    UENV_NAME: nlcglib-mi300
    UENV_RECIPE: ci/nlcglib-uenv-recipe-mi300/
    UENV_VERSION: v1
    SLURM_TIMELIMIT: 600

build nlcglib mi300:
  extends: [.uenv-runner-beverin-mi300, .f7t-secrets]
  stage: build
  needs: ["build base uenv mi300"]
  image: nlcglib-mi300/v1:$CI_PIPELINE_ID
  artifacts:
    paths:
      - builddir.tar
  variables:
    SPEC: nlcglib +rocm +tx +tests build_type=RelWithDebInfo cxxflags=-Werror
    ROCM_ARCH: gfx942
  script:
    - |
      #
      git clone --filter=tree:0 $(jq -r .spack.repo /user-environment/meta/configure.json) /dev/shm/spack-clone
      git -C /dev/shm/spack-clone checkout $(jq -r .spack.commit /user-environment/meta/configure.json)
      source /dev/shm/spack-clone/share/spack/setup-env.sh
      bwrap --dev-bind / / --tmpfs ~ -- ./ci/build-rocm.sh

.run_tests:
  script:
    - |
      if [ $SLURM_LOCALID -eq 0 ]; then
        tar xf ./builddir.tar -C /
        touch /dev/shm/unpack_done_$CI_JOB_ID
      fi
    - |
      # wait for tar unpack
      while [ ! -f /dev/shm/unpack_done_$CI_JOB_ID ]; do
        sleep 0.2
      done

      stagedir=$(find /dev/shm/spack-stage -type d -name "spack-stage-nlcglib-*")
      echo "stagedir: $stagedir"
      cd $stagedir
      builddir=$(find ./ -type d -name "spack-build-*")
      cd $builddir
      $TEST_COMMAND

beverin test unit tests:
  extends: [.uenv-runner-beverin-mi300, .f7t-secrets, .run_tests]
  image: nlcglib-mi300/v1:$CI_PIPELINE_ID
  stage: test
  needs: ["build nlcglib mi300"]
  variables:
    OMP_NUM_THREADS: 8
    SLURM_TIMELIMIT: '30:00'
    SLURM_NTASKS: 1
    SRUN_CPUS_PER_TASK: 8
    SLURM_CPUS_PER_TASK: 8
    SLURM_GPUS: 1
    SLURM_GPUS_PER_TASK: 1
    TEST_COMMAND: ./unit_tests/nlcglib_unit_tests
